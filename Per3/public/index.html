<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather & Geocoding API - Ridha Novita Handayani</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: radial-gradient(circle at top, #0f3832, #071f1b 60%, #030f0d 100%);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            background: rgba(13, 25, 30, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            width: 100%;
            max-width: 440px;
            padding: 28px 24px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        }

        .header {
            text-align: center;
            margin-bottom: 22px;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            background: rgba(20, 184, 166, 0.12);
            color: #2dd4bf;
            padding: 5px 14px;
            border-radius: 9999px;
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            border: 1px solid rgba(45, 212, 191, 0.28);
            margin-bottom: 12px;
        }

        .dot {
            width: 8px;
            height: 8px;
            background: #10b981;
            border-radius: 50%;
            box-shadow: 0 0 8px #10b981;
        }

        .header h2 {
            font-size: 1.45rem;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 6px;
            letter-spacing: -0.2px;
        }

        .header p {
            font-size: 0.88rem;
            color: #94a3b8;
            font-weight: 500;
        }

        .header .nim-badge {
            color: #2dd4bf;
            background: rgba(45, 212, 191, 0.12);
            padding: 2px 7px;
            border-radius: 6px;
            font-weight: 600;
        }

        .search {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .search input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 12px;
            outline: none;
            font-size: 0.95rem;
            background: rgba(4, 38, 32, 0.55);
            color: #ffffff;
            transition: all 0.2s ease;
        }

        .search input::placeholder {
            color: #64748b;
        }

        .search input:focus {
            border-color: #2dd4bf;
            background: rgba(4, 38, 32, 0.85);
            box-shadow: 0 0 0 3px rgba(45, 212, 191, 0.2);
        }

        .search button {
            background: #14b8a6;
            color: #ffffff;
            border: none;
            padding: 0 22px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .search button:hover {
            background: #0d9488;
        }

        .search button:active {
            transform: scale(0.97);
        }

        #status {
            text-align: center;
            font-size: 0.8rem;
            color: #f87171;
            min-height: 18px;
            margin-bottom: 10px;
            display: none;
        }

        #hasil {
            background: rgba(4, 18, 20, 0.4);
            border-radius: 14px;
            padding: 8px 18px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            font-size: 0.9rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }

        .row:last-child {
            border-bottom: none;
        }

        .row span:first-child {
            color: #94a3b8;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .row span:last-child {
            color: #ffffff;
            font-weight: 700;
            text-align: right;
            max-width: 60%;
            word-break: break-word;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="header">
            <div class="badge">
                <span class="dot"></span>
                <span>PWS Pertemuan 3</span>
            </div>
            <h2>Weather & Geocoding API</h2>
            <p>Ridha Novita Handayani • <span class="nim-badge">20240140022</span></p>
        </div>

        <div class="search">
            <input type="text" id="input-lokasi" placeholder="Cari lokasi..." autocomplete="off">
            <button id="btn-cari">Cari</button>
        </div>

        <div id="status"></div>

        <div id="hasil">
            <div class="row">
                <span>🌍 Negara</span>
                <span id="negara">-</span>
            </div>
            <div class="row">
                <span>🏛️ Provinsi</span>
                <span id="provinsi">-</span>
            </div>
            <div class="row">
                <span>📍 Kecamatan/Wilayah</span>
                <span id="kecamatan">-</span>
            </div>
            <div class="row">
                <span>🧭 Longitude</span>
                <span id="longitude">-</span>
            </div>
            <div class="row">
                <span>🧭 Latitude</span>
                <span id="latitude">-</span>
            </div>
        </div>
    </div>

</body>
</html>
